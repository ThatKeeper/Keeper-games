<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

  <title>El buscaminas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

  <header>
    <h1>Buscaminas</h1>
    <p>Elige el tamaño del terreno y la densidad de cargas, y despeja la cuadrícula sin detonar ninguna.</p>
  </header>

  <div class="panel">
    <div class="seg" id="difficulty-seg">
      <button data-preset="beginner" class="active">Principiante</button>
      <button data-preset="intermediate">Intermedio</button>
      <button data-preset="expert">Experto</button>
      <button data-preset="custom">Personalizado</button>

      <button data-preset="infinite" id="infinite-btn" class="secret-mode" hidden>
        Infinito ∞
      </button>
    </div>

    <div class="custom-fields" id="custom-fields">
      <div class="field">
        <label for="in-rows">Filas</label>
        <input type="number" id="in-rows" min="5" max="24" value="9">
      </div>

      <div class="field">
        <label for="in-cols">Columnas</label>
        <input type="number" id="in-cols" min="5" max="24" value="9">
      </div>

      <div class="field">
        <label for="in-mines">Minas</label>
        <input type="number" id="in-mines" min="1" max="72" value="10">
      </div>

      <div class="field-hint" id="mines-hint">
        Máximo 72 minas para una cuadrícula de 9 × 9.
      </div>
    </div>
  </div>


  <div class="infinite-status" id="infinite-rules" hidden></div>

  <div class="dash">

    <div class="readout">
      <span class="label">minas restantes</span>
      <span class="digits" id="mine-counter">010</span>
    </div>

    <button
      class="lamp-btn"
      id="reset-btn"
      aria-label="Reiniciar partida"
      title="Reiniciar partida"
    >
      <svg id="lamp-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="10" r="6.2" fill="var(--brass)"/>
        <path d="M9 16.5h6l-1 4h-4l-1-4z" fill="#443826"/>
        <circle cx="12" cy="10" r="2.4" fill="#fff3d6"/>
      </svg>
    </button>

    <!-- Oculto fuera del modo infinito y antes del desbloqueo -->
    <div class="readout infinite-readout" id="infinite-readout" hidden>
      <span class="label">nivel infinito</span>
      <span class="digits" id="infinite-level">01</span>
    </div>

    <div class="readout">
      <span class="label">tiempo</span>
      <span class="digits" id="timer">000</span>
    </div>

  </div>

<div class="board-shell">
  <div
    class="board"
    id="board"
    role="grid"
    aria-label="Cuadrícula de buscaminas"
  ></div>

  <div class="level-rules" id="level-rules" hidden>
    <div class="level-rules-title">REGLAS DEL NIVEL</div>
    <div class="level-rules-list" id="level-rules-list"></div>
  </div>
</div>

  <div class="footer-row">

    <div class="mode-toggle" id="mode-toggle">
      <button data-mode="reveal" class="active">Revelar</button>
      <button data-mode="flag">Marcar</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

  </div>

</div>

<div class="secret-modal" id="secret-modal" hidden>
  <div class="secret-modal-box">
    <div class="secret-modal-title">¿?</div>

    <div class="konami-sequence" id="konami-sequence">
      <span data-key="ArrowUp">↑</span>
      <span data-key="ArrowUp">↑</span>
      <span data-key="ArrowDown">↓</span>
      <span data-key="ArrowDown">↓</span>
      <span data-key="ArrowLeft">←</span>
      <span data-key="ArrowRight">→</span>
      <span data-key="ArrowLeft">←</span>
      <span data-key="ArrowRight">→</span>
      <span data-key="b">B</span>
      <span data-key="a">A</span>
    </div>

    <div class="konami-controls">
      <button data-secret-key="ArrowUp">↑</button>
      <button data-secret-key="ArrowDown">↓</button>
      <button data-secret-key="ArrowLeft">←</button>
      <button data-secret-key="ArrowRight">→</button>
      <button data-secret-key="b">B</button>
      <button data-secret-key="a">A</button>
    </div>

    <div class="secret-modal-hint">
      Introduce el código.
    </div>
  </div>
</div>

<div class="infinite-unlock-effect" id="infinite-unlock-effect" hidden>
  <div class="unlock-stars"></div>
  <div class="unlock-message">
    <span>INFINITO</span>
    <small>DESBLOQUEADO</small>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
