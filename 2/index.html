<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nexo | Tres en raya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">

            <a class="brand" href="#game">
                <span class="brand-symbol">◇</span>

                <span>
                    <b>NEXO</b>
                    <small>TRES EN RAYA</small>
                </span>
            </a>

            <span class="round">
                RONDA
                <b id="round">01</b>
            </span>

            <button
                id="top-new"
                class="icon-button"
                type="button"
                aria-label="Nueva partida"
            >
                ↻
            </button>

        </header>

        <div class="layout">

            <section id="game" class="game-area">

                <div class="intro">

                    <div>

                        <p class="eyebrow">
                            SALA DE JUEGO
                            <i></i>
                        </p>

                        <h1>
                            Piensa.<br>
                            <em>Conecta.</em><br>
                            Gana.
                        </h1>

                    </div>

                    <div class="turn-box">

                        <small id="turn-label">
                            TU TURNO
                        </small>

                        <b id="turn-text">
                            Juega con X
                        </b>

                    </div>

                </div>

                <div class="score">

                    <span>
                        <b class="x">X</b>
                        Tu marcador

                        <small id="score-x">
                            0 victorias
                        </small>
                    </span>

                    <b class="colon">:</b>

                    <span class="right">
                        Rival
                        <b class="o">O</b>

                        <small id="score-o">
                            0 victorias
                        </small>
                    </span>

                </div>

                <div class="board-frame">

                    <canvas
                        id="board"
                        tabindex="0"
                        aria-label="Tablero de tres en raya"
                    ></canvas>

                    <div
                        id="result"
                        class="result"
                        hidden
                    >

                        <small id="result-label">
                            Partida terminada
                        </small>

                        <strong id="result-text">
                            Victoria
                        </strong>

                        <button
                            id="again"
                            type="button"
                        >
                            Jugar otra vez
                        </button>

                    </div>

                </div>

                <footer class="board-info">

                    <span>
                        Selecciona una celda para jugar
                    </span>

                    <span id="config">
                        3 × 3 · conecta 3
                    </span>

                </footer>

            </section>

            <aside class="panel">

                <p class="eyebrow">
                    CONTROL ROOM
                </p>

                <h2>
                    Configura tu partida
                </h2>

                <hr>

                <label class="label">
                    Modo de juego
                </label>

                <div class="modes">

                    <button
                        class="mode active"
                        data-mode="robot"
                        type="button"
                    >
                        ◎ Contra robot
                    </button>

                    <button
                        class="mode"
                        data-mode="player"
                        type="button"
                    >
                        ◎ Dos jugadores
                    </button>

                </div>

                <label class="label">

                    Tamaño del tablero

                    <output id="size-value">
                        3 × 3
                    </output>

                    <input
                        id="size"
                        type="range"
                        min="3"
                        max="9"
                        value="3"
                    >

                    <small>
                        De 3 × 3 hasta 9 × 9
                    </small>

                </label>

                <label class="label">

                    Fichas para ganar

                    <output id="win-value">
                        3 en línea
                    </output>

                    <input
                        id="win"
                        type="range"
                        min="3"
                        max="3"
                        value="3"
                    >

                    <small>
                        Siempre se mantiene dentro del tablero
                    </small>

                </label>

                <label class="label">
                    Personaliza las fichas
                </label>

                <div class="piece-list">

                    <label class="piece">

                        <b class="x">
                            X
                        </b>

                        <span>
                            Tu ficha

                            <small>
                                Jugador X
                            </small>
                        </span>

                        <input
                            id="x-color"
                            type="color"
                            value="#ff6b4a"
                            aria-label="Color de X"
                        >

                    </label>

                    <label class="piece">

                        <b class="o">
                            O
                        </b>

                        <span>
                            Tu rival

                            <small id="rival-name">
                                Robot
                            </small>
                        </span>

                        <input
                            id="o-color"
                            type="color"
                            value="#39d6c5"
                            aria-label="Color de O"
                        >

                    </label>

                </div>

                <label class="label">
                    Ambiente
                </label>

                <div class="themes">

                    <button
                        class="theme active"
                        data-theme="ember"
                        type="button"
                        aria-label="Tema coral"
                    ></button>

                    <button
                        class="theme mint"
                        data-theme="mint"
                        type="button"
                        aria-label="Tema menta"
                    ></button>

                    <button
                        class="theme violet"
                        data-theme="violet"
                        type="button"
                        aria-label="Tema violeta"
                    ></button>

                    <button
                        class="theme sun"
                        data-theme="sun"
                        type="button"
                        aria-label="Tema amarillo"
                    ></button>

                </div>

                <button
                    id="new"
                    class="primary"
                    type="button"
                >
                    Nueva partida
                    <span>→</span>
                </button>

                <button
                    id="restore"
                    class="restore"
                    type="button"
                >
                    Restaurar ajustes
                </button>

            </aside>

        </div>

    </main>

    <script src="app.js"></script>

</body>

</html>
