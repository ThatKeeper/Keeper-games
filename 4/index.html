<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PONG | Sala de juego</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar">
    <a class="brand" href="../index.html">
        <span class="brand-symbol">◇</span>
        <span><b>PONG</b>
            <small>DUEL ARENA</small>
        </span>
    </a>
    <span class="round">PARTIDA 
        <b id="round">01

        </b>
    </span>
    <button id="top-new" class="icon-button" type="button" aria-label="Nueva partida">↻</button>
</header>

<div class="layout">
<section class="game-area">
<div class="intro"><div>
    <p class="eyebrow">SALA DE JUEGO 
        <i></i>
    </p>
    <h1>Stay.
        <br>
        <em>In play.</em>
    </h1>
</div>

<div class="turn-box">
    <small id="status-label">PRIMERA SAQUE</small>
    <b id="status-text">Tú empiezas</b>
</div>
</div>
<div class="score">
    <span>
        <b class="player-mark">01</b> Tú 
        <small id="score-player">0 puntos</small>
    </span>
    <b class="colon">:</b>
    <span class="right">Rival 
        <b class="rival-mark">02</b>
        <small id="score-rival">0 puntos</small>
    </span>
</div>

<div class="board-frame">
    <canvas id="board" tabindex="0" aria-label="Partida de Pong"></canvas>
    <div id="result" class="result" hidden>
        <small id="result-label">Partida terminada</small>
        <strong id="result-text">Victoria</strong>
        <button id="again" type="button">Jugar otra vez</button>
    </div>
</div>

<footer class="board-info">
    <span>W / S o ↑ / ↓ para mover</span>
    <span>Primero en llegar a 
        <b id="target-label">7</b>
    </span>
</footer>

<div class="touch-controls">
    <button data-key="up" aria-label="Mover arriba">↑</button>
    <button data-key="down" aria-label="Mover abajo">↓</button>
</div>

</section>
<aside class="panel">
    <p class="eyebrow">CONTROL ROOM</p>
    <h2>Configura tu duelo</h2>
    <hr>
<label class="label">Modo de juego</label>
<div class="modes">
    <button class="mode active" data-mode="robot" type="button">◎ Contra robot</button>
    <button class="mode" data-mode="player" type="button">◎ Dos jugadores</button>
</div>
<label class="label" for="difficulty">Dificultad 
    <output id="difficulty-value">Normal</output>
    <input id="difficulty" type="range" min="1" max="3" value="2">
    <small>La IA reacciona a tu ritmo</small>
</label>
<label class="label" for="target">Puntos para ganar 
    <output id="target-value">7 puntos</output>
    <input id="target" type="range" min="3" max="11" step="2" value="7">
    <small>Una partida corta o al mejor duelo</small>
</label>
<label class="label">Personaliza la arena</label>
<div class="piece-list">
    <label class="piece">
        <b class="player-mark">01</b>
        <span>Tu pala
            <small>Jugador 1</small>
        </span>
        <input 
            id="player-color" 
            type="color" 
            value="#ff6b4a" 
            aria-label="Color de tu pala"
        >
    </label>
    <label class="piece">
        <b class="rival-mark">02</b>
        <span>Rival
            <small id="rival-name">Robot</small>
        </span>
        <input 
            id="rival-color" 
            type="color" 
            value="#39d6c5" 
            aria-label="Color de la pala rival"
            >
        </label>
    </div>

<label class="label">Ambiente</label>
<div class="themes">
    <button 
        class="theme active" 
        data-theme="ember" 
        type="button" 
        aria-label="Tema coral"
        >
    </button>
    <button 
        class="theme mint" 
        data-theme="mint" 
        type="button" 
        aria-label="Tema menta"
        >
    </button>
    <button 
        class="theme violet" 
        data-theme="violet" 
        type="button" 
        aria-label="Tema violeta"
        >
    </button>
    <button 
        class="theme sun" 
        data-theme="sun" 
        type="button" 
        aria-label="Tema amarillo"
        >
    </button>
</div>

<button 
    id="new" 
    class="primary" 
    type="button"
    >Nueva partida 
    <span>→</span>
</button>

<button 
    id="restore" 
    class="restore" 
    type="button"
    >Restaurar ajustes
</button>
</aside>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
