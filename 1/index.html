<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Snake | Mini Arcade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <header>

            <div>
                <p class="eyebrow">
                    Mini arcade / 01
                </p>

                <h1>
                    Snake
                </h1>
            </div>

            <div class="scores">

                <div>
                    <span>
                        Puntos
                    </span>

                    <strong id="puntos">
                        0
                    </strong>
                </div>

                <div>
                    <span>
                        Récord
                    </span>

                    <strong id="record">
                        0
                    </strong>
                </div>

            </div>

        </header>

        <section class="game-shell">

            <div id="juego">

                <canvas
                    id="tablero"
                    aria-label="Tablero del juego Snake"
                ></canvas>

                <div
                    id="estado"
                    class="status"
                >

                    <div>
                        <strong>
                            Snake
                        </strong>

                        <span>
                            Pulsa una flecha para comenzar
                        </span>
                    </div>

                </div>

            </div>

            <div class="toolbar">

                <span class="hint">
                    Flechas / WASD para moverte · Espacio para pausar
                </span>

                <button
                    id="reiniciar"
                    type="button"
                >
                    Reiniciar
                </button>

            </div>

            <div class="controls">

                <button
                    data-direccion="arriba"
                    aria-label="Arriba"
                >
                    â–²
                </button>

                <button
                    data-direccion="izquierda"
                    aria-label="Izquierda"
                >
                    â—€
                </button>

                <button
                    data-direccion="abajo"
                    aria-label="Abajo"
                >
                    â–¼
                </button>

                <button
                    data-direccion="derecha"
                    aria-label="Derecha"
                >
                    â–¶
                </button>

            </div>

        </section>

        <section class="personalizacion">

            <div class="custom-heading">

                <div>

                    <p class="eyebrow">
                        Tu partida / 02
                    </p>

                    <h2>
                        Personaliza el tablero
                    </h2>

                </div>

                <button
                    id="restaurar-colores"
                    class="text-button"
                    type="button"
                >
                    Restaurar
                </button>

            </div>

            <div class="color-grid">

                <div
                    class="color-control"
                    data-color-control="fondo"
                >

                    <label for="color-fondo">
                        Fondo del grid
                    </label>

                    <div class="color-inputs">

                        <input
                            id="color-fondo"
                            class="color-picker"
                            type="color"
                            value="#121a2a"
                        >

                        <input
                            class="hex-input"
                            type="text"
                            value="#121A2A"
                            maxlength="7"
                        >

                    </div>

                    <div class="presets">

                        <button
                            type="button"
                            data-preset="#121a2a"
                            style="--swatch:#121a2a"
                        ></button>

                        <button
                            type="button"
                            data-preset="#f5f0e8"
                            style="--swatch:#f5f0e8"
                        ></button>

                        <button
                            type="button"
                            data-preset="#152b2a"
                            style="--swatch:#152b2a"
                        ></button>

                    </div>

                </div>

                <div
                    class="color-control"
                    data-color-control="grid"
                >

                    <label for="color-grid">
                        Líneas del grid
                    </label>

                    <div class="color-inputs">

                        <input
                            id="color-grid"
                            class="color-picker"
                            type="color"
                            value="#1d2940"
                        >

                        <input
                            class="hex-input"
                            type="text"
                            value="#1D2940"
                            maxlength="7"
                        >

                    </div>

                    <div class="presets">

                        <button
                            type="button"
                            data-preset="#1d2940"
                            style="--swatch:#1d2940"
                        ></button>

                        <button
                            type="button"
                            data-preset="#d8cfc0"
                            style="--swatch:#d8cfc0"
                        ></button>

                        <button
                            type="button"
                            data-preset="#28504a"
                            style="--swatch:#28504a"
                        ></button>

                    </div>

                </div>

                <div
                    class="color-control"
                    data-color-control="serpiente"
                >

                    <label for="color-serpiente">
                        Serpiente
                    </label>

                    <div class="color-inputs">

                        <input
                            id="color-serpiente"
                            class="color-picker"
                            type="color"
                            value="#b8e34a"
                        >

                        <input
                            class="hex-input"
                            type="text"
                            value="#B8E34A"
                            maxlength="7"
                        >

                    </div>

                    <div class="presets">

                        <button
                            type="button"
                            data-preset="#b8e34a"
                            style="--swatch:#b8e34a"
                        ></button>

                        <button
                            type="button"
                            data-preset="#49d4c0"
                            style="--swatch:#49d4c0"
                        ></button>

                        <button
                            type="button"
                            data-preset="#ff6b8a"
                            style="--swatch:#ff6b8a"
                        ></button>

                    </div>

                </div>

                <div
                    class="color-control"
                    data-color-control="manzana"
                >

                    <label for="color-manzana">
                        Manzana
                    </label>

                    <div class="color-inputs">

                        <input
                            id="color-manzana"
                            class="color-picker"
                            type="color"
                            value="#ff9d5c"
                        >

                        <input
                            class="hex-input"
                            type="text"
                            value="#FF9D5C"
                            maxlength="7"
                        >

                    </div>

                    <div class="presets">

                        <button
                            type="button"
                            data-preset="#ff9d5c"
                            style="--swatch:#ff9d5c"
                        ></button>

                        <button
                            type="button"
                            data-preset="#ef476f"
                            style="--swatch:#ef476f"
                        ></button>

                        <button
                            type="button"
                            data-preset="#ffdc5e"
                            style="--swatch:#ffdc5e"
                        ></button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
